version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1-PE1-AS2000
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
no ip icmp rate-limit unreachable
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
no cdp log mismatch duplex
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 100.1.1.1 255.255.255.255
!
interface Ethernet0/0
 no ip address
 duplex auto
!
interface Ethernet0/1
 ip address 10.10.40.2 255.255.255.252
 duplex auto
!
interface Ethernet0/2
 ip address 20.1.2.1 255.255.255.252
 duplex auto
!
interface Ethernet0/3
 ip address 20.1.3.1 255.255.255.252
 duplex auto
!
router ospf 1
 router-id 100.1.1.1
 passive-interface Ethernet0/1
 network 20.1.2.0 0.0.0.3 area 0
 network 20.1.3.0 0.0.0.3 area 0
 network 100.1.1.1 0.0.0.0 area 0
!
router bgp 2000
 bgp log-neighbor-changes
 neighbor 10.10.40.1 remote-as 200
 neighbor 100.1.1.2 remote-as 2000
 neighbor 100.1.1.2 update-source Loopback0
 neighbor 100.1.1.3 remote-as 2000
 neighbor 100.1.1.3 update-source Loopback0
 neighbor 100.1.1.4 remote-as 2000
 neighbor 100.1.1.4 update-source Loopback0
 neighbor 100.1.1.5 remote-as 2000
 neighbor 100.1.1.5 update-source Loopback0
 !
 address-family ipv4
  network 10.10.40.0 mask 255.255.255.252
  neighbor 10.10.40.1 activate
  neighbor 100.1.1.2 activate
  neighbor 100.1.1.3 activate
  neighbor 100.1.1.4 activate
  neighbor 100.1.1.5 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input none
!
!
end