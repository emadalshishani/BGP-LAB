version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R5-IGR2-AS2000
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
no ip icmp rate-limit unreachable
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
no cdp log mismatch duplex
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!!
!
!
interface Loopback0
 ip address 100.1.1.5 255.255.255.255
!
interface Ethernet0/0
 ip address 20.3.5.2 255.255.255.252
 duplex auto
!
interface Ethernet0/1
 ip address 20.4.5.2 255.255.255.252
 duplex auto
!
interface Ethernet0/2
 ip address 20.5.20.2 255.255.255.252
 duplex auto
!
interface Ethernet0/3
 ip address 20.5.10.2 255.255.255.252
 duplex auto
!
router ospf 1
 router-id 100.1.1.5
 passive-interface Ethernet0/2
 passive-interface Ethernet0/3
 network 20.3.5.0 0.0.0.3 area 0
 network 20.4.5.0 0.0.0.3 area 0
 network 100.1.1.5 0.0.0.0 area 0
!
router bgp 2000
 bgp router-id 100.1.1.5
 no bgp log-neighbor-changes
 neighbor 20.5.10.1 remote-as 3000
 neighbor 20.5.20.1 remote-as 4000
 neighbor 100.1.1.1 remote-as 2000
 neighbor 100.1.1.1 update-source Loopback0
 neighbor 100.1.1.2 remote-as 2000
 neighbor 100.1.1.2 update-source Loopback0
 neighbor 100.1.1.3 remote-as 2000
 neighbor 100.1.1.3 update-source Loopback0
 neighbor 100.1.1.4 remote-as 2000
 neighbor 100.1.1.4 update-source Loopback0
 !
 address-family ipv4
  network 20.5.10.0 mask 255.255.255.252
  network 20.5.20.0 mask 255.255.255.252
  neighbor 20.5.10.1 activate
  neighbor 20.5.20.1 activate
  neighbor 100.1.1.1 activate
  neighbor 100.1.1.2 activate
  neighbor 100.1.1.3 activate
  neighbor 100.1.1.4 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input none
!
!
end