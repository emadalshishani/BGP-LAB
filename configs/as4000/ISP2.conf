version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISP2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
no ip icmp rate-limit unreachable
!
!
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
no cdp log mismatch duplex
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 20.20.20.20 255.255.255.255
!
interface Ethernet0/0
 ip address 10.5.20.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/1
 ip address 10.6.20.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/2
 ip address 20.5.20.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/3
 ip address 20.4.20.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet1/0
 no ip address
 shutdown
 duplex auto
!
interface Ethernet1/1
 ip address 30.10.20.2 255.255.255.252
 duplex auto
!
interface Ethernet1/2
 no ip address
 shutdown
 duplex auto
!
interface Ethernet1/3
 ip address dhcp
 ip nat outside
 ip virtual-reassembly in
 duplex auto
!
router bgp 4000
 bgp router-id 20.20.20.20
 no bgp log-neighbor-changes
 neighbor 10.5.20.2 remote-as 1000
 neighbor 10.6.20.2 remote-as 1000
 neighbor 20.4.20.2 remote-as 2000
 neighbor 20.5.20.2 remote-as 2000
 neighbor 30.10.20.1 remote-as 3000
 !
 address-family ipv4
  network 0.0.0.0
  network 10.5.20.0 mask 255.255.255.252
  network 10.6.20.0 mask 255.255.255.252
  network 20.4.20.0 mask 255.255.255.252
  network 20.5.20.0 mask 255.255.255.252
  network 30.10.20.0 mask 255.255.255.252
  neighbor 10.5.20.2 activate
  neighbor 10.6.20.2 activate
  neighbor 20.4.20.2 activate
  neighbor 20.5.20.2 activate
  neighbor 30.10.20.1 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip nat inside source list 1 interface Ethernet1/3 overload
ip route 0.0.0.0 0.0.0.0 10.142.13.1
!
ipv6 ioam timestamp
!
!
access-list 1 permit any
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input none
!
!
end